<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мастера Хошимина</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F8F2E7;--terra:#B8480F;--terra-l:#FCE6D6;--jade:#1F5A47;--teal:#2E7F7C;--gold:#E8A817;--ink:#1F2A24;--mute:#5B665F;--line:#E9DFCB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden}body.cta-on{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:800}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.lu{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.pb{height:44px;padding:0 12px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--ink);position:relative;flex:none;white-space:nowrap}.pb .lu{width:18px;height:18px}
.ib b,.pb b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--terra);color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 4px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}.brand b{font:800 14px/1.05 Manrope;color:var(--jade)}
.wrap{padding:0 16px 16px}
.hv{height:112px;border-radius:24px;margin:0 16px;position:relative;overflow:hidden;background:#F4B782 var(--hero) center/cover}
.tag{position:absolute;left:12px;top:12px;font:600 22px/1 Caveat,cursive;color:var(--terra);background:#fff;padding:4px 12px 6px;border-radius:12px;transform:rotate(-4deg)}
.hh{font-size:22px;line-height:1.2;margin:14px 0 6px}.hp{margin:0 0 12px;color:var(--mute);font-size:14px}
.sr{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;color:var(--mute)}
.sr input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0;height:100%;color:var(--ink);margin:0;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;display:flex;align-items:center}
.chip.on{background:var(--jade);border-color:var(--jade);color:#fff}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 4px}
.ct{background:#fff;border-radius:18px;padding:12px 4px 10px;text-align:center;font-size:12px;line-height:1.2;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(31,42,36,.06);min-height:96px}
.ct i{width:44px;height:44px;border-radius:50%;background:var(--terra-l);color:var(--terra);display:flex;align-items:center;justify-content:center}
.sec{margin:20px 0 8px}.sec h2{font-size:17px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:128px;background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(31,42,36,.06)}
.mini img{width:64px;height:64px;border-radius:50%;object-fit:cover}.mini b{display:block;font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini span{font-size:12px;color:var(--mute)}
.join{background:var(--jade);color:#fff;border-radius:22px;padding:18px;margin-top:20px}.join p{margin:4px 0 12px;font-size:14px;opacity:.95}.join .btn{background:#fff;color:var(--jade)}
.foot{text-align:center;font-size:12.5px;color:var(--mute);margin:16px 0 0}
.mc{display:flex;gap:12px;background:#fff;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(31,42,36,.06);position:relative;align-items:center;cursor:pointer}
.mav{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none;background:#eee}
.mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-right:30px}.mi b{font-size:15px;display:flex;align-items:center;gap:4px}
.mu{color:var(--mute);font-size:13px}.mu .lu{width:14px;height:14px;vertical-align:-2px}
.mr{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:13px;font-weight:700}.pr{color:var(--terra)}
.st{color:var(--gold);font-style:normal}.new{color:var(--teal);font-weight:700;font-size:12.5px}
.hb{position:absolute;right:4px;top:4px;width:40px;height:40px;color:var(--mute);display:flex;align-items:center;justify-content:center}.hb.on{color:var(--terra)}.hb.on .lu{fill:var(--terra)}
.ver{display:inline-flex;color:var(--jade)}.ver .lu{width:18px;height:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;color:var(--mute)}
select.sel{width:auto;margin:0;padding:8px 10px;font-size:13px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink);font-family:inherit}
.pf{background:#fff;border-radius:26px;padding:20px 16px;text-align:center;box-shadow:0 6px 20px rgba(31,42,36,.08)}
.pav{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--terra-l);display:block;margin:0 auto 10px}
.pf h1{font-size:21px;display:flex;align-items:center;justify-content:center;gap:6px}
.pills{margin:10px 0}.pill{display:inline-block;background:#E4F2EB;color:var(--jade);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:99px;margin:2px}
.facts{display:flex;gap:8px;margin:12px 0}.fact{flex:1;background:var(--cream);border-radius:14px;padding:10px 4px;font-weight:800}.fact span{display:block;font-size:12.5px;font-weight:600;color:var(--mute)}
.desc{text-align:left;margin:8px 0 0}.h3{text-align:left;font-size:16px;margin:18px 0 8px}
.svc{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--cream);border-radius:14px;margin-bottom:8px;font-weight:600;font-size:14px;text-align:left}.svc b{color:var(--terra);white-space:nowrap}
.wks{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.wk{flex:none;width:132px;height:132px;border-radius:16px;background:#eee center/cover}
.r{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px;box-shadow:0 2px 8px rgba(31,42,36,.05)}.r .h{display:flex;justify-content:space-between;margin-bottom:4px}
.link{color:var(--mute);font-size:13px;text-decoration:underline;display:block;text-align:center;margin:14px auto 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:16px;background:var(--terra);color:#fff;font-weight:800;font-size:15px;padding:0 14px}
.btn.j{background:var(--jade)}.btn.o{background:none;color:var(--terra);border:2px solid var(--terra)}.btn.s{height:42px;font-size:14px}.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#cta{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cream);border-top:1px solid var(--line);display:none;gap:10px;z-index:6}#cta.on{display:flex}
.sh{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}.sh>div{background:var(--cream);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sh h3{margin-bottom:10px}.lb{display:block;font-size:13px;font-weight:700;margin:8px 2px 4px}
input,select,textarea{width:100%;font:16px Manrope,sans-serif;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;color:var(--ink)}
.svr{display:grid;grid-template-columns:1fr 104px 44px;gap:8px;align-items:start}.svr .ib{height:46px}
.warn{background:#FFF1D6;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
details{margin:10px 0}summary{font-weight:700;padding:10px 0;cursor:pointer}
.th{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}.th div{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:10px;display:block}.th a{position:absolute;top:-6px;right:-6px;background:var(--terra);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-weight:700}
.stars button{font-size:34px;color:#D9CBB5;padding:0 3px}.stars button.on{color:var(--gold)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--jade);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:30;max-width:92%;text-align:center}.toast.err{background:var(--terra)}
.ld{padding:36px 16px;text-align:center;color:var(--mute)}.ld .btn{width:auto;display:inline-flex;margin-top:12px}
</style></head><body>

 ${S.state==="error"?`<div class="ld">Не удалось загрузить мастеров.<br><button class="btn s" data-a="retry">Повторить</button></div>`:S.state==="loading"?`<div class="ld">Загружаем мастеров…</div>`:strip("Новые мастера",nw)+strip("Избранные",fv)}
 <div class="join"><h2>Вы мастер?</h2><p>Разместите анкету за 2 минуты: клиенты напишут вам в Telegram.</p><button class="btn" data-a="newm">Разместить анкету</button></div>
 <button class="btn o s" data-a="support" style="margin-top:14px">${lu("send")} Связаться с поддержкой</button>
 <p class="foot">${lu("shield-check")} Значок означает, что администратор связался с мастером и проверил его работы.</p></div>`}
function items(){let L=S.masters.filter(m=>(S.gi==null||SUBS[m.slug].g===S.gi)&&(!S.sub||m.slug===S.sub)&&(S.area==="all"||m.d===S.area));
 const sc=m=>{const r=rate(m);return (m.ver?100:0)+r.a*r.n+r.n};
 if(S.sort==="rec")L.sort((a,b)=>sc(b)-sc(a)||(b.up||"").localeCompare(a.up||""));
 else if(S.sort==="price")L.sort((a,b)=>(a.pf||1e12)-(b.pf||1e12));
 else if(S.sort==="rating")L.sort((a,b)=>rate(b).a-rate(a).a||rate(b).n-rate(a).n);
 else L.sort((a,b)=>b.cr.localeCompare(a.cr));return L}
function card(m){const r=rate(m),s=SUBS[m.slug];
 return `<div class="mc" data-a="open" data-id="${m.id}"><img class="mav" src="${ava(m)}" alt="" loading="lazy"><div class="mi"><b>${esc(m.n)}${m.ver?ver:""}</b><span class="mu">${esc(s.n)} · ${esc(D[m.d]||"")}</span>
 <div class="mr"><span class="pr">${m.pf?"от "+fmt(m.pf):""}</span><span>${r.n?`<i class="st">★</i> ${r.a.toFixed(1)} (${r.n})`:`<span class="new">Новый</span>`}</span></div></div>
 <button class="hb ${S.fav.includes(m.id)?"on":""}" data-a="fav" data-id="${m.id}" aria-label="В избранное">${lu("heart")}</button></div>`}
function res(){if(S.state==="loading")return `<div class="ld">Загружаем…</div>`;
 if(S.state==="error")return `<div class="ld">Не удалось загрузить мастеров.<br><button class="btn s" data-a="retry">Повторить</button></div>`;
 const L=items();if(!L.length)return `<div class="ld">${S.masters.length?"Ничего не найдено. Попробуйте изменить фильтры.":"Пока здесь нет мастеров."}<br><button class="btn s" data-a="newm">Я мастер — разместить анкету</button></div>`;
 return `<div class="row"><span>Найдено: ${L.length}</span><select class="sel" id="sort">${[["rec","Рекомендуемые"],["price","Дешевле"],["rating","По рейтингу"],["new","Новые"]].map(o=>`<option value="${o[0]}" ${S.sort===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`+L.map(card).join("")}
function list(){const g=S.gi!=null?GR[S.gi]:null,subs=g?g[3].filter(s=>S.masters.some(m=>m.slug===s[0])):[];
 return `<div class="wrap">${offb()}<h1 class="hh" style="margin-top:4px">${g?esc(g[1]):"Все мастера"}</h1>
 ${subs.length>1?`<div class="chips"><button class="chip ${S.sub?"":"on"}" data-a="sub" data-s="">Все</button>${subs.map(s=>`<button class="chip ${S.sub===s[0]?"on":""}" data-a="sub" data-s="${s[0]}">${esc(s[1])}</button>`).join("")}</div>`:""}
 ${areaChips()}
 <div id="res">${res()}</div></div>`}
function master(){const m=getM(S.mid);if(!m)return `<div class="ld">Анкета не найдена или временно скрыта.</div>`;
 const r=rate(m),own=isMine(m),adm=S.me&&S.me.admin,rv=S.revs[m.k]||[],s=SUBS[m.slug];
 return `<div class="wrap"><div class="pf"><img class="pav" src="${ava(m)}" alt=""><h1>${esc(m.n)}${m.ver?ver:""}</h1><div class="mu">${esc(s.n)} · ${lu("map-pin")} ${esc(D[m.d]||"")}</div>
 <div class="facts"><div class="fact">${r.n?`<i class="st">★</i> ${r.a.toFixed(1)}`:"Новый"}<span>${r.n?r.n+" отзывов":"пока без отзывов"}</span></div>${m.exp?`<div class="fact">${m.exp} лет<span>опыт</span></div>`:""}</div>
 ${m.up?`<div class="mu">Обновлено: ${ago(m.up)}</div>`:""}${own&&(m.paused||m.status!=="approved")?`<div class="warn">${m.status==="pending"?"Анкета на проверке, клиенты её не видят.":m.status==="rejected"?"Анкета отклонена. Исправьте её и отправьте снова.":"Анкета на паузе, клиенты её не видят."}</div>`:""}
 ${m.desc?`<p class="desc">${esc(m.desc)}</p>`:""}
 <h3 class="h3">Услуги и цены</h3>${m.sv.map(x=>`<div class="svc"><span>${esc(x.n)}</span><b>${fmt(x.p)}</b></div>`).join("")}
 ${m.ph.length?`<h3 class="h3">Работы</h3><div class="wks">${m.ph.map(u=>`<button class="wk" data-a="zoom" data-u="${esc(u)}" style="background-image:url('${esc(u)}')" aria-label="Открыть фото"></button>`).join("")}</div>`:""}</div>
 <h3 class="h3" style="margin-top:20px">Отзывы</h3>${rv.map(x=>`<div class="r"><div class="h"><b>${esc(x.name)}${adm?` <a data-a="delrev" data-id="${x.id}" style="color:var(--terra)">✕</a>`:""}</b><span class="st">${"★".repeat(x.rating)}${"☆".repeat(5-x.rating)}</span></div>${esc(x.text)}</div>`).join("")||`<p class="mu">Отзывов пока нет.</p>`}
 ${own?"":`<button class="btn o s" data-a="review">Оставить отзыв</button><button class="link" data-a="report">Пожаловаться на анкету</button><button class="link" data-a="support">Связаться с поддержкой</button>`}
 ${adm&&!m.demo&&m.status==="pending"?`<div class="btns"><button class="btn s j" data-a="approve" data-id="${m.id}">Одобрить</button><button class="btn s o" data-a="reject" data-id="${m.id}">Отклонить</button></div>`:""}${adm&&!m.demo?`<div class="btns"><button class="btn o s" data-a="${m.ver?"unverify":"verify"}" data-id="${m.id}">${m.ver?"Снять «проверен»":"Отметить «проверен»"}</button><button class="btn o s" data-a="del" data-id="${m.id}">Удалить анкету</button></div>`:""}</div>`}
function cta(){const m=S.v==="master"&&getM(S.mid),c=$("#cta");
 if(!m){c.className="";c.innerHTML="";document.body.classList.remove("cta-on");return}
 c.className="on";document.body.classList.add("cta-on");
 c.innerHTML=`<button class="ib" data-a="fav" data-id="${m.id}" aria-label="В избранное" style="${S.fav.includes(m.id)?"color:var(--terra)":""}">${lu("heart")}</button>`+(isMine(m)?`<button class="btn" data-a="edit" data-id="${m.id}">Редактировать анкету</button>`:`<button class="btn" data-a="tg" data-id="${m.id}">${lu("send")} Написать в Telegram</button>`)}
function render(){$("#app").innerHTML=hdr()+({home,list,master}[S.v]||home)();cta();if(tg&&tg.BackButton){S.stack.length?tg.BackButton.show():tg.BackButton.hide()}}
/* ===== Окна ===== */
function sheet(html){const e=document.createElement("div");e.className="sh";e.innerHTML=`<div>${html}</div>`;e.onclick=ev=>{if(ev.target===e)e.remove()};document.body.appendChild(e);return e}
const subOpts=sel=>GR.map(g=>`<optgroup label="${esc(g[1])}">${g[3].map(s=>`<option value="${s[0]}" ${s[0]===sel?"selected":""}>${esc(s[1])}</option>`).join("")}</optgroup>`).join("");
const statusOf=m=>m.status==="pending"?"На проверке":m.status==="rejected"?"Отклонена":m.paused?"На паузе":"Опубликована";
function cabinet(){sheet(`<h3>Мои анкеты</h3>${S.mine.map(m=>`<div class="r"><b>${esc(m.n)}</b> <span class="mu">· ${statusOf(m)}</span><div class="btns"><button class="btn s o" data-a="open" data-id="${m.id}">Открыть</button><button class="btn s" data-a="edit" data-id="${m.id}">Править</button><button class="btn s o" data-a="pause" data-id="${m.id}">${m.paused?"Возобновить":"Приостановить"}</button><button class="btn s o" data-a="del" data-id="${m.id}">Удалить</button></div></div>`).join("")}<button class="btn" data-a="newm">Новая анкета</button><button class="btn o s" data-a="support" style="margin-top:8px">Связаться с поддержкой</button>`)}
function admin(){sheet(`<h3>На проверке: ${S.pending.length}</h3>${S.pending.map(m=>`<div class="r"><b>${esc(m.n)}</b> · ${esc(SUBS[m.slug]?SUBS[m.slug].n:m.slug)} · ${esc(D[m.d]||"")}<br><span class="mu">@${esc(m.nick)}</span><br>${esc(m.desc)}<br>${m.sv.map(x=>esc(x.n)+" "+fmt(x.p)).join("; ")}<div class="th" style="margin-top:8px">${m.av?`<div><img src="${esc(m.av)}" alt=""></div>`:""}${m.ph.map(u=>`<div><img src="${esc(u)}" alt=""></div>`).join("")}</div><div class="btns"><button class="btn s j" data-a="approve" data-id="${m.id}">Одобрить</button><button class="btn s o" data-a="reject" data-id="${m.id}">Отклонить</button></div></div>`).join("")||`<p class="mu">Новых анкет нет.</p>`}`)}
function mform(x){
 let rows=x?x.sv.map(s=>({n:s.n,p:s.p})):[{n:"",p:""},{n:"",p:""}],keep=x?[...x.ph]:[],clr=false;
 const un=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{}).username||"",nick=x?x.nick:un;
 const e=sheet(`<h3>${x?"Моя анкета":"Новая анкета"}</h3><p class="mu" style="margin:0 0 6px">Клиенты напишут вам: ${nick?"@"+esc(nick)+" (из вашего Telegram)":"имя пользователя не задано"}</p>
 ${nick?"":`<div class="warn">Задайте имя пользователя в Telegram (Настройки → Имя пользователя), иначе клиенты не смогут вам написать.</div>`}
 <label class="lb">Чем вы занимаетесь *</label><select id="fs">${subOpts(x&&x.slug)}</select>
 <label class="lb">Ваше имя *</label><input id="fn" maxlength="60" value="${esc(x?x.n:"")}" autocomplete="name">
 <label class="lb">Район *</label><select id="fd">${DK.map(k=>`<option value="${k}" ${x&&x.d===k?"selected":""}>${D[k]}</option>`).join("")}</select>
 <label class="lb">Услуги и цены в донгах *</label><div id="fr"></div><button type="button" class="btn o s" id="fadd">+ Добавить услугу</button>
 <details ${x?"open":""}><summary>Дополнить анкету (можно позже)</summary>
 <label class="lb">Фото профиля</label><input id="fa" type="file" accept="image/*">${x&&x.av?`<button type="button" class="btn o s" id="fclr" style="margin-bottom:8px">Удалить текущее фото</button>`:""}
 <label class="lb">О себе (до 300 символов)</label><textarea id="fx" rows="3" maxlength="300">${esc(x?x.desc:"")}</textarea>
 <label class="lb">Опыт, лет</label><input id="fe" type="number" min="0" max="60" inputmode="numeric" value="${x&&x.exp?x.exp:""}">
 <label class="lb">Фото работ (до 10)</label><div class="th" id="fk"></div><input id="fw" type="file" accept="image/*" multiple></details>
 <button class="btn" id="fgo" style="margin-top:8px">${x?"Сохранить":"Отправить на проверку"}</button>`);
 const q=s=>e.querySelector(s);
 const drawR=()=>{q("#fr").innerHTML=rows.map((r,i)=>`<div class="svr"><input data-i="${i}" data-f="n" maxlength="60" placeholder="Услуга, например: Стрижка" value="${esc(r.n)}"><input data-i="${i}" data-f="p" inputmode="numeric" placeholder="Цена ₫" value="${esc(r.p)}"><button type="button" class="ib" data-d="${i}" aria-label="Удалить">${lu("x")}</button></div>`).join("")};
 const drawK=()=>{q("#fk").innerHTML=keep.map((u,i)=>`<div><img src="${esc(u)}" alt=""><a data-r="${i}">✕</a></div>`).join("")};
 drawR();drawK();
 q("#fr").oninput=ev=>{const t=ev.target;if(t.dataset.i!=null)rows[+t.dataset.i][t.dataset.f]=t.value};
 q("#fr").onclick=ev=>{const b=ev.target.closest("[data-d]");if(b&&rows.length>1){rows.splice(+b.dataset.d,1);drawR()}};
 q("#fadd").onclick=()=>{if(rows.length<12){rows.push({n:"",p:""});drawR()}};
 q("#fk").onclick=ev=>{const a=ev.target.closest("[data-r]");if(a){keep.splice(+a.dataset.r,1);drawK()}};
 const cl=q("#fclr");if(cl)cl.onclick=()=>{clr=true;cl.textContent="Фото будет удалено"};
 q("#fgo").onclick=async()=>{const b=q("#fgo"),sv=rows.map(r=>({n:String(r.n).trim(),p:parseInt(String(r.p).replace(/\D/g,""))||0})).filter(r=>r.n&&r.p>0);
  if(!q("#fn").value.trim()||!sv.length)return toast("Укажите имя и хотя бы одну услугу с ценой",1);
  if(!nick)return toast("Сначала задайте имя пользователя в Telegram",1);
  b.disabled=true;b.textContent="Отправляем…";
  const af=q("#fa").files[0],ad=af?await shrink(af,400,true):null,left=Math.max(0,10-keep.length),pd=(await Promise.all([...q("#fw").files].slice(0,left).map(f=>shrink(f,800)))).filter(Boolean);
  try{if(!x&&tg&&tg.requestWriteAccess)tg.requestWriteAccess()}catch(_){}
  const r=await api(x?"update":"apply",{id:x&&x.id,master:{name:q("#fn").value.trim(),sub:q("#fs").value,district:q("#fd").value,services:sv,descr:q("#fx").value.trim(),exp:q("#fe").value,keep,photos:pd,avatar:ad,avatarClear:clr}});
  if(r.error){b.disabled=false;b.textContent=x?"Сохранить":"Отправить на проверку";return toast(r.error,1)}
  e.remove();await load();toast(x?"Сохранено":r.status==="approved"?"Анкета опубликована":"Отправлено на проверку. Мы сообщим в Telegram")}}
function reviewForm(m){let rt=5;const e=sheet(`<h3>Отзыв о мастере</h3><p class="mu" style="margin:0 0 6px">Отзыв будет опубликован от вашего имени в Telegram.</p><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button type="button" class="on" data-i="${i}">★</button>`).join("")}</div><textarea id="rt" rows="3" maxlength="600" placeholder="Что вам понравилось?"></textarea><button class="btn" id="go">Отправить</button>`);
 e.querySelector("#st").onclick=ev=>{const b=ev.target.closest("[data-i]");if(!b)return;rt=+b.dataset.i;e.querySelectorAll("#st button").forEach(x=>x.classList.toggle("on",+x.dataset.i<=rt))};
 e.querySelector("#go").onclick=async()=>{const t=e.querySelector("#rt").value.trim();if(t.length<3)return toast("Напишите пару слов",1);if(m.demo){(S.revs[m.k]=S.revs[m.k]||[]).unshift({id:0,master_key:m.k,name:"Вы",rating:rt,text:t,created_at:new Date().toISOString()});e.remove();render();return toast("Спасибо за отзыв!")}const r=await api("review",{master_key:m.k,rating:rt,text:t});if(r.error)return toast(r.error,1);e.remove();await load();toast("Спасибо за отзыв!")}}
function supportForm(){const cm=S.v==="master"&&getM(S.mid);const e=sheet(`<h3>Связаться с поддержкой</h3><p class="mu" style="margin:0 0 8px">Ответим вам в Telegram. Если у вас не задано имя пользователя (Настройки → Имя пользователя), мы всё равно сможем написать вам.</p><label class="lb">Тема</label><select id="sp">${["Вопрос по работе приложения","Проблема с моей анкетой","Предложение или идея","Жалоба на пользователя","Другое"].map(x=>`<option>${x}</option>`).join("")}</select><label class="lb">Сообщение</label><textarea id="sx" rows="4" maxlength="600" placeholder="Опишите вопрос. Если речь об анкете, укажите её название"></textarea><button class="btn" id="go">Отправить</button>`);
 e.querySelector("#go").onclick=async()=>{const t=e.querySelector("#sx").value.trim();if(t.length<5)return toast("Опишите вопрос подробнее",1);const b=e.querySelector("#go");b.disabled=true;
  const r=await api("support",{topic:e.querySelector("#sp").value,text:t,context:cm&&!cm.demo?cm.id:null});if(r.error){b.disabled=false;return toast(r.error,1)}e.remove();toast("Сообщение отправлено. Ответим в Telegram")}}
function reportForm(m){const e=sheet(`<h3>Пожаловаться на анкету</h3><select id="rs">${["Фейковая анкета","Мошенничество","Неверные контакты или цены","Неприемлемое содержание","Другое"].map(x=>`<option>${x}</option>`).join("")}</select><textarea id="rx" rows="2" maxlength="200" placeholder="Подробности (по желанию)"></textarea><button class="btn" id="go">Отправить жалобу</button>`);
 e.querySelector("#go").onclick=async()=>{if(m.demo){e.remove();return toast("Спасибо, мы проверим анкету")}const r=await api("report",{id:m.id,reason:e.querySelector("#rs").value+": "+e.querySelector("#rx").value});if(r.error)return toast(r.error,1);e.remove();toast("Спасибо, мы проверим анкету")}}
/* ===== Действия (все клики через data-a, без вставки данных в код) ===== */
const run=async(a,t)=>{const id=+t.dataset.id,m=getM(id);
 switch(a){
 case"back":return back();case"retry":return load();
 case"grp":return nav("list",{gi:+t.dataset.g});
 case"area":S.area=t.dataset.v;ls.set("area",S.area);return render();
 case"sub":S.sub=t.dataset.s;return render();
 case"open":return nav("master",{mid:id});
 case"fav":{const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);ls.set("fav",S.fav);const y=scrollY;render();scrollTo(0,y);return}
 case"tg":{if(!m)return;if(m.demo){sheet(`<h3>Написать мастеру</h3><p>В рабочей версии здесь откроется чат в Telegram: <b>@${esc(m.nick)}</b>.</p><p class="mu">В примерах анкет переход отключён, чтобы вы случайно не написали незнакомому человеку.</p><button class="btn" data-a="close">Понятно</button>`);return}return openTg(m.nick)}
 case"share":{const l=APPLINK+"?startapp=m"+S.mid,u="https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent("Мастер в Хошимине");tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank");return}
 case"zoom":{const e=sheet(`<img src="${esc(t.dataset.u)}" alt="" style="width:100%;max-height:85vh;object-fit:contain;border-radius:12px">`);e.firstChild.style.background="none";return}
 case"review":return m0()&&reviewForm(m0());
 case"report":return m0()&&reportForm(m0());
 case"newm":return mform(null);
 case"support":return supportForm();
 case"edit":return m&&mform(m);
 case"cab":return cabinet();case"adm":return admin();
 case"pause":{const r=await api("pause",{id,paused:!m.paused});if(r.error)return toast(r.error,1);await load();return toast(m.paused?"Анкета опубликована":"Анкета на паузе")}
 case"del":return ask("Удалить анкету вместе с фото и отзывами? Это нельзя отменить.",async ok=>{if(!ok)return;const r=await api("remove",{id});if(r.error)return toast(r.error,1);if(S.v==="master")back();await load();toast("Удалено")});
 case"approve":case"reject":case"verify":case"unverify":{const r=await api("moderate",{id,op:a});if(r.error)return toast(r.error,1);await load();return toast("Готово")}
 case"delrev":return ask("Удалить отзыв?",async ok=>{if(!ok)return;const r=await api("delete_review",{id});if(r.error)return toast(r.error,1);await load()})}};
const m0=()=>getM(S.mid);
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
 if(t.closest(".sh")&&a!=="zoom")document.querySelectorAll(".sh").forEach(x=>x.remove());run(a,t)});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;$("#res").innerHTML=res()}});
if(tg&&tg.BackButton)tg.BackButton.onClick(back);
render();load();
</script></body></html>
