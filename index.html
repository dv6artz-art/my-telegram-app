 p.ontouchstart=e=>{if(e.target.closest(".strip"))return;on=true;lock=0;dx=0;x0=e.touches[0].clientX;y0=e.touches[0].clientY;p.style.transition="none"};
 p.ontouchmove=e=>{if(!on)return;dx=e.touches[0].clientX-x0;const dy=e.touches[0].clientY-y0;
  if(!lock){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))lock=1;else if(Math.abs(dy)>8)lock=2}
  if(lock!==1)return;
  const edge=(S.idx===0&&dx>0)||(S.idx===LN-1&&dx<0),d=edge?dx*.25:dx;
  p.style.transform=`translateX(${d}px) rotate(${d/25}deg)`;p.style.opacity=1-Math.min(Math.abs(d)/500,.4)};
 p.ontouchend=()=>{if(!on)return;on=false;if(lock!==1)return;
  const dir=dx<0?1:-1,ok=Math.abs(dx)>80&&S.idx+dir>=0&&S.idx+dir<LN;
  p.style.transition="transform .25s ease,opacity .25s ease";
  if(!ok){p.style.transform="";p.style.opacity="";return}
  p.style.transform=`translateX(${-dir*innerWidth}px) rotate(${-dir*18}deg)`;p.style.opacity=0;
  setTimeout(()=>{S.idx+=dir;render();scrollTo(0,0);const q=$("#prof");if(q){q.style.transition="none";q.style.transform=`translateX(${dir*innerWidth*.4}px)`;q.style.opacity=0;q.offsetWidth;q.style.transition="transform .28s ease,opacity .28s ease";q.style.transform="";q.style.opacity=""}},230)}}}

   else S.extra.push({m:m.k,a:"Гость",r:rate,t:tx});
   e.remove();render();toast("Спасибо за отзыв!")}}
 else{e.innerHTML=`<div><h3>Заявка: ${esc(m.n)}</h3><input id="fn" placeholder="Ваше имя"><input id="ft2" placeholder="Ваш Telegram (@ник)"><input id="fd" type="date"><textarea id="fm" rows="3" placeholder="Сообщение мастеру">${si!=null?"Хочу записаться: "+esc(svcs(m)[si][0]):""}</textarea><button class="btn j" id="go">Отправить заявку</button></div>`;
  document.body.appendChild(e);
  $("#go").onclick=async()=>{const n=$("#fn").value.trim(),t=$("#ft2").value.trim(),d=$("#fd").value;if(!n||!t||!d)return toast("Укажите имя, Telegram и дату");

function sheet2(t,id){const e=document.createElement("div");e.className="sh";e.onclick=ev=>{if(ev.target===e)e.remove()};
 if(t==="apply"){const un=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.username)||"";
  e.innerHTML=`<div><h3>Анкета мастера</h3><input id="an" placeholder="Имя"><select id="ac">${catOpts(-1)}</select><select id="ad">${Object.keys(D).map(k=>`<option value="${k}">${D[k]}</option>`).join("")}</select><input id="at" placeholder="Telegram-ник" value="${esc(un)}"><input id="ae" type="number" placeholder="Опыт, лет"><textarea id="ax" rows="3" placeholder="О себе"></textarea><textarea id="as" rows="5" placeholder="Услуги, по одной в строке:&#10;Стрижка — 250000&#10;Стрижка + борода — 400000"></textarea><label class="lb">Ваше фото</label><input id="aa" type="file" accept="image/*"><label class="lb">Фото работ (до 6)</label><input id="aw" type="file" accept="image/*" multiple><button class="btn" id="go">Отправить на проверку</button></div>`;
  document.body.appendChild(e);
  $("#go").onclick=async()=>{const sv=$("#as").value.split("\n").map(l=>{const x=l.trim().match(/^(.+?)[\s:—–-]+(\d[\d\s.,]*)$/);if(!x)return null;let p=+x[2].replace(/\D/g,"");if(p<5000)p*=1000;return{n:x[1].trim(),p}}).filter(Boolean);
   if(!$("#an").value.trim()||!$("#at").value.trim()||!sv.length)return toast("Нужны имя, ник и хотя бы одна услуга");
   toast("Загружаем фото…");const avf=$("#aa").files[0],avd=avf?await shrink(avf,400):null,phd=(await Promise.all([...$("#aw").files].slice(0,6).map(f=>shrink(f)))).filter(Boolean);const r=await api("apply",{master:{avatar:avd,photos:phd,name:$("#an").value.trim(),sub:$("#ac").value,district:$("#ad").value,nick:$("#at").value.trim(),exp:$("#ae").value,descr:$("#ax").value.trim(),services:sv}});
   if(r.error)return toast(r.error);e.remove();if(r.status==="approved")await load();toast(r.status==="approved"?"Анкета опубликована":"Отправлено на проверку")}}
 else if(t==="edit"){const x=S.mine.find(z=>z.id==id);if(!x)return;let keep=[...(x.photos||[])],clr=false;
  const opt=(o,sel)=>Object.keys(o).map(k=>`<option value="${k}" ${String(k)===String(sel)?"selected":""}>${o[k]}</option>`).join("");
  e.innerHTML=`<div><h3>Моя анкета</h3>${x.status==="pending"?'<p class="mu" style="font-size:13px">Анкета ещё на проверке у администратора</p>':''}
  <label class="lb">Имя</label><input id="en" value="${esc(x.name)}">
  <label class="lb">Категория</label><select id="ecat">${catOpts(x.sub)}</select>
  <label class="lb">Район</label><select id="edis">${opt(D,x.district)}</select>
  <label class="lb">Telegram-ник</label><input id="et" value="${esc(x.nick)}">
  <label class="lb">Опыт, лет</label><input id="ee" type="number" value="${x.exp||0}">
  <label class="lb">О себе</label><textarea id="ex" rows="3">${esc(x.descr||"")}</textarea>
  <label class="lb">Услуги: по одной в строке, «название — цена»</label><textarea id="es" rows="8">${(x.services||[]).map(s=>esc(s.n)+" — "+s.p).join("\n")}</textarea>
  <label class="lb">Аватарка</label>${x.avatar?`<img src="${x.avatar}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin-bottom:8px">`:''}
  <input id="ea" type="file" accept="image/*">${x.avatar?'<button class="btn o" id="ecl" style="margin:0 0 10px">Удалить аватарку</button>':''}
  <label class="lb">Фото работ (до 6)</label><div id="ek" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px"></div>
  <input id="ew" type="file" accept="image/*" multiple><button class="btn" id="go">Сохранить</button></div>`;
  document.body.appendChild(e);
  const draw=()=>{$("#ek").innerHTML=keep.map((u,i)=>`<div style="position:relative"><img src="${u}" style="width:72px;height:72px;object-fit:cover;border-radius:10px"><a data-i="${i}" style="position:absolute;top:-6px;right:-6px;background:var(--terra);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;font-weight:700">✕</a></div>`).join("")||'<span class="mu" style="font-size:13px">Фото пока нет</span>'};draw();
  $("#ek").onclick=ev=>{const i=ev.target.dataset.i;if(i!=null){keep.splice(+i,1);draw()}};
  const cb=$("#ecl");if(cb)cb.onclick=()=>{clr=true;cb.textContent="Аватарка будет удалена"};
  $("#go").onclick=async()=>{const sv=parseSv($("#es").value);if(!$("#en").value.trim()||!$("#et").value.trim()||!sv.length)return toast("Нужны имя, ник и хотя бы одна услуга");
   toast("Сохраняем…");const af=$("#ea").files[0],ad=af?await shrink(af,400):null,pd=(await Promise.all([...$("#ew").files].slice(0,Math.max(0,6-keep.length)).map(f=>shrink(f)))).filter(Boolean);
   const r=await api("update",{id:x.id,master:{name:$("#en").value.trim(),sub:$("#ecat").value,district:$("#edis").value,nick:$("#et").value.trim(),exp:$("#ee").value,descr:$("#ex").value.trim(),services:sv,keep,photos:pd,avatar:ad,avatarClear:clr}});
   if(r.error)return toast(r.error);e.remove();S.step=1;await load();toast("Сохранено")}}
 else{e.innerHTML=`<div><h3>На проверке: ${(S.pending||[]).length}</h3>${(S.pending||[]).map(x=>`<div class="r"><b>${esc(x.name)}</b> · ${CATS[x.sub][1]} · ${D[x.district]}<br>@${esc(x.nick)}<br>${esc(x.descr)}<br>${(x.photos||[]).map(u=>`<img src="${u}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;margin:4px 4px 0 0">`).join("")}<div style="display:flex;gap:8px"><button class="btn j" onclick="mod(${x.id},'approve')">Одобрить</button><button class="btn o" onclick="mod(${x.id},'reject')">Отклонить</button></div></div>`).join("")||"<p class=mu>Новых анкет нет</p>"}</div>`;document.body.appendChild(e)}}
async function mod(id,op){if(op==="delete"&&!confirm("Удалить анкету?"))return;const r=await api("moderate",{id,op});if(r.error)return toast(r.error);document.querySelectorAll(".sh").forEach(x=>x.remove());if(op==="delete")S.step=2;await load();toast("Готово")}
async function delRev(id){if(!confirm("Удалить отзыв?"))return;const r=await api("delete_review",{id});if(r.error)return toast(r.error);await load();toast("Удалён")}
function parseSv(t){return t.split("\n").map(l=>{const x=l.trim().match(/^(.+?)[\s:—–-]+(\d[\d\s.,]*)$/);if(!x)return null;let p=+x[2].replace(/\D/g,"");if(p<5000)p*=1000;return{n:x[1].trim(),p}}).filter(Boolean)}
function shrink(f,max=900){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}
function zoom(u){const e=document.createElement("div");e.className="sh";e.style.cssText="align-items:center;background:#000d";e.onclick=()=>e.remove();e.innerHTML=`<img src="${u}" style="width:100%;max-height:90vh;object-fit:contain">`;document.body.appendChild(e)}
if(!SEED)M.length=0;render();API?load():initDB();
